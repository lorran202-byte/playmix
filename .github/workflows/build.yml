name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Testes
        run: gradle testReleaseUnitTest --stacktrace

      - name: Compilar APK
        run: gradle assembleRelease --stacktrace

      - name: Renomear APK
        run: |
          VERSION=$(grep versionName app/build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk "out/PlayMix-v${VERSION}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: PlayMix-apk
          path: out/*.apk
