name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # O runner já vem com o Android SDK instalado (ANDROID_HOME)
      - name: Conferir Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.11.1"

      - name: Testes e APK
        run: |
          set -o pipefail
          gradle testReleaseUnitTest assembleRelease --console=plain 2>&1 | tee build.log

      - name: Mostrar erros
        if: failure()
        run: |
          grep -E "^e: |error:|FAILED|What went wrong|AssertionError|Exception" build.log | head -60 > errors.txt || true
          [ -s errors.txt ] || tail -60 build.log > errors.txt
          split -l 12 errors.txt part_
          for f in part_*; do
            msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' "$f")
            echo "::error title=Build::${msg}"
          done

      - name: Publicar APK no branch builds
        run: |
          VERSION=$(grep versionName app/build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')
          APK="PlayMix-v${VERSION}.apk"
          cp app/build/outputs/apk/release/*.apk "/tmp/$APK"
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan builds
          git rm -rf --quiet .
          cp "/tmp/$APK" .
          git add "$APK"
          git commit -m "APK $APK (${GITHUB_SHA::7})"
          git push -f origin builds
